<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Robot Assistant</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0B2447;
    color:white;
}

.header{
    text-align:center;
    padding:20px;
}

.chat{
    width:90%;
    max-width:900px;
    height:450px;
    margin:auto;
    background:white;
    color:black;
    border-radius:15px;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin:10px 0;
}

.user{
    text-align:right;
}

.user span{
    background:#2196F3;
    color:white;
    padding:10px 15px;
    border-radius:15px;
    display:inline-block;
}

.bot span{
    background:#EAEAEA;
    padding:10px 15px;
    border-radius:15px;
    display:inline-block;
}

.controls{
    width:90%;
    max-width:900px;
    margin:20px auto;
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
    border-radius:10px;
    border:none;
}

button{
    padding:15px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.send{
    background:#00A86B;
    color:white;
}

.home{
    background:#666;
    color:white;
}

.quick-buttons{
    width:90%;
    max-width:900px;
    margin:10px auto;
    text-align:center;
}

.quick-buttons button{
    margin:5px;
}

</style>
</head>

<body>

<div class="header">
    <h1>🤖 Robot Assistant</h1>
    <p>Ask me anything</p>
</div>

<div class="chat" id="chat">

    <div class="message bot">
        <span>Hello! How can I help you today?</span>
    </div>

</div>

<div class="quick-buttons">
    <button onclick="quickAsk('Tell me about your products')">
        Products
    </button>

    <button onclick="quickAsk('What services do you offer')">
        Services
    </button>

    <button onclick="quickAsk('How can I contact you')">
        Contact
    </button>
</div>

<div class="controls">

    <input
        type="text"
        id="question"
        placeholder="Type your question...">

    <button class="send" onclick="sendMessage()">
        Send
    </button>

    <button class="home"
        onclick="window.location.href='index.html'">
        Home
    </button>

</div>

<script>

function quickAsk(text){
    document.getElementById("question").value = text;
    sendMessage();
}

function sendMessage(){

    let input = document.getElementById("question");
    let question = input.value.trim();

    if(question === ""){
        return;
    }

    let chat = document.getElementById("chat");

    chat.innerHTML += `
    <div class="message user">
        <span>${question}</span>
    </div>
    `;

    let response = getResponse(question);

    chat.innerHTML += `
    <div class="message bot">
        <span>${response}</span>
    </div>
    `;

    input.value = "";

    chat.scrollTop = chat.scrollHeight;
}

function getResponse(question){

    question = question.toLowerCase();

    if(question.includes("product")){
        return "We offer innovative solutions designed to improve sustainability and customer experience.";
    }

    if(question.includes("service")){
        return "We provide consulting, support, and digital solutions tailored to customer needs.";
    }

    if(question.includes("contact")){
        return "Please contact our team through our website or visit our booth for assistance.";
    }

    if(question.includes("price")){
        return "Pricing depends on your requirements. Please speak with a representative.";
    }

    return "Thank you for your question. One of our representatives will be happy to assist you further.";
}

document.getElementById("question")
.addEventListener("keypress", function(event){
    if(event.key === "Enter"){
        sendMessage();
    }
});

</script>

</body>
</html>
