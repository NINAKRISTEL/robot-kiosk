<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Akara AI Assistant</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#0B2447;
    color:white;
    margin:0;
    padding:0;
}

.header{
    text-align:center;
    padding:20px;
}

.header h1{
    margin:0;
}

.chatbox{
    width:90%;
    max-width:900px;
    height:500px;
    margin:20px auto;
    background:white;
    color:black;
    border-radius:15px;
    overflow-y:auto;
    padding:20px;
}

.user{
    text-align:right;
    margin:10px;
}

.bot{
    text-align:left;
    margin:10px;
}

.user span{
    background:#339AF0;
    color:white;
    padding:10px 15px;
    border-radius:15px;
    display:inline-block;
}

.bot span{
    background:#E9ECEF;
    padding:10px 15px;
    border-radius:15px;
    display:inline-block;
}

.input-area{
    max-width:900px;
    width:90%;
    margin:auto;
    display:flex;
    gap:10px;
    padding-bottom:30px;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
    border-radius:10px;
    border:none;
}

button{
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.send{
    background:#00A86B;
    color:white;
}

.back{
    background:#6C757D;
    color:white;
}

</style>
</head>

<body>

<div class="header">
    <h1>🤖 Akara AI Assistant</h1>
    <p>How can I help you today?</p>
</div>

<div class="chatbox" id="chatbox">

    <div class="bot">
        <span>Hello! Ask me anything.</span>
    </div>

</div>

<div class="input-area">

    <input
        type="text"
        id="question"
        placeholder="Type your question here...">

    <button class="send" onclick="sendQuestion()">
        Send
    </button>

    <button class="back"
        onclick="window.location.href='index.html'">
        Home
    </button>

</div>

<script>

function sendQuestion(){

    let q = document.getElementById("question").value;

    if(q.trim() === ""){
        return;
    }

    let chatbox =
        document.getElementById("chatbox");

    chatbox.innerHTML += `
        <div class="user">
            <span>${q}</span>
        </div>
    `;

    let answer =
        getResponse(q);

    chatbox.innerHTML += `
        <div class="bot">
            <span>${answer}</span>
        </div>
    `;

    document.getElementById("question").value="";

    chatbox.scrollTop =
        chatbox.scrollHeight;
}

function getResponse(question){

    question = question.toLowerCase();

    if(question.includes("product")){
        return "Our products are designed to improve sustainability and energy efficiency.";
    }

    if(question.includes("price")){
        return "Please contact our sales team for pricing information.";
    }

    if(question.includes("contact")){
        return "You may reach us at info@company.com.";
    }

    if(question.includes("energy")){
        return "Energy-efficient solutions can reduce electricity consumption significantly.";
    }

    return "Thank you for your question. A team member will be happy to assist further.";
}

</script>

</body>
</html>
